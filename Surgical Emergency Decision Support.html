<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surgical Emergency Decision Support</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f1f5f9;--surface:#fff;--ink:#0f172a;--muted:#475569;--line:#cbd5e1;--blue:#1d4ed8;--tint:#eff6ff;--hl:#fef9c3;
    --c-resus:#dc2626;--c-diag:#2563eb;--c-img:#0f766e;--c-trig:#b45309;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#111b2e;--ink:#e6edf7;--muted:#a3b3ca;--line:#2a3a55;--blue:#8ab8ff;--tint:#14243f;--hl:#3a3410}}
  :root[data-theme="dark"]{--bg:#0b1220;--surface:#111b2e;--ink:#e6edf7;--muted:#a3b3ca;--line:#2a3a55;--blue:#8ab8ff;--tint:#14243f;--hl:#3a3410}
  html{scroll-padding-top:9rem}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
  .bar{background:var(--surface);border-bottom:1px solid var(--line)}
  .input{background:var(--bg);border:1.5px solid var(--line);color:var(--ink)}
  .input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
  .chip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap;font-weight:500}
  .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
  :root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0b1220}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0b1220}}
  .chip:focus-visible,summary:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .muted{color:var(--muted)}
  .pill{background:var(--tint);color:var(--blue);font-weight:600;border-radius:999px;padding:.1rem .65rem;font-size:.75rem}
  .hl{background:var(--hl);border:1px solid var(--line);border-radius:10px}
  .sec{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:var(--bg)}
  .sec summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;font-weight:600}
  .sec summary::-webkit-details-marker{display:none}
  .sec .badge{background:var(--c);color:#fff;border-radius:6px;min-width:1.6rem;height:1.6rem;display:grid;place-items:center;font-size:.8rem}
  .sec .chev{margin-left:auto;transition:transform .15s}
  .sec[open] .chev{transform:rotate(90deg)}
  .sec ul{padding:.1rem .9rem .9rem 2.4rem;list-style:disc}
  .sec li{margin-top:.35rem}
  .sec li::marker{color:var(--c)}
  .btn{border:1.5px solid var(--line);border-radius:8px;padding:.25rem .7rem;font-size:.8rem;font-weight:500;color:var(--muted);background:var(--surface)}
  .sec .body{padding:0 .9rem .9rem}
  .lab{display:grid;gap:.1rem;padding:.55rem .9rem;border-top:1px solid var(--line);font-size:.9rem}
  .lab .n{font-weight:600}.lab .r{color:var(--muted)}.lab .f{color:var(--ink)}
  .lab .r::before{content:'Normal: ';font-weight:600}.lab .f::before{content:'In disease: ';font-weight:600;color:var(--c)}
  .lab.head{display:none}
  @media(min-width:720px){.lab{grid-template-columns:10rem 13rem 1fr;gap:1rem}.lab .r::before,.lab .f::before{content:none}
    .lab.head{display:grid;font-weight:600;font-size:.8rem;color:var(--muted);border-top:0}}
  .flow{display:flex;flex-direction:column;align-items:center;gap:.4rem}
  .fbox{border:1.5px solid var(--c,var(--line));background:var(--surface);border-radius:10px;padding:.6rem .8rem;width:100%;font-size:.9rem}
  .fbox b{display:block;color:var(--c,var(--ink));margin-bottom:.15rem}
  .farrow{color:var(--muted);line-height:1;font-size:1.1rem}
  .fbranches{display:grid;gap:1rem;width:100%}
  @media(min-width:720px){.fbranches{grid-template-columns:1fr 1fr}}
  .br{display:flex;flex-direction:column;align-items:center;gap:.4rem;border-top:4px solid var(--c);padding-top:.5rem}
  .brh{font-weight:700;color:var(--c)}
  @media (prefers-reduced-motion:reduce){.sec .chev{transition:none}}
</style>
</head>
<body>

<header class="bar sticky top-0 z-20" style="top:env(safe-area-inset-top,0px)">
  <div class="max-w-5xl mx-auto px-4 pt-3 pb-3">
    <div class="flex items-baseline justify-between gap-3">
      <h1 class="text-lg sm:text-xl font-bold">Surgical Emergency Decision Support</h1>
      <span class="text-xs muted hidden sm:inline">For students and surgical residents</span>
    </div>
    <label class="sr-only" for="q">Search conditions</label>
    <input id="q" type="search" autocomplete="off" placeholder="Search by condition, symptom or keyword (e.g. RIF pain, Murphy, free air)"
      class="input w-full mt-2 rounded-lg px-3 py-2.5 text-base">
    <div id="chips" class="flex gap-2 mt-2 overflow-x-auto pb-1" role="group" aria-label="Category filter"></div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-4">
  <p id="count" class="text-sm muted mb-3" aria-live="polite"></p>
  <div id="list" class="grid gap-4"></div>
  <p id="empty" class="hidden card p-6 text-center muted">No matching conditions. Clear the search or choose another category.</p>
  <p class="text-xs muted mt-8 mb-6">Educational reference only. It does not replace local protocols, senior review or clinical judgement. Doses and thresholds vary by institution.</p>
</main>

<script>
/* =====================================================================
   DATA SCHEMA: append new conditions to the DATA array below.
   {
     id:        'unique-slug',
     name:      'Condition name',
     category:  one of CATEGORIES (add a new string there to create a new chip),
     presentation: 'Typical presenting complaint (one line)',
     keywords:  ['extra', 'search', 'terms'],
     highlight: { title: 'Score or criteria box', rows: [['label','value'], ...], note: 'optional footer' },
     labs:        [['Test','Normal range','Expected finding in this disease'], ...],
     algo:        { triage:'Step 1 question', unstable:['Step 2','Step 3'], stable:['Step 2','Step 3'] },
     resus:       ['bullet', ...],   // a. Immediate Bedside Resuscitation
     diagnostics: ['bullet', ...],   // b. Essential Diagnostics & Labs
     imaging:     ['bullet', ...],   // c. First-line Imaging & Bedside Ultrasound
     triggers:    ['bullet', ...]    // d. Surgical Triggers & Red Flags
   }
   ===================================================================== */
const CATEGORIES = ['Hepatobiliary', 'Lower GIT / Appendix', 'Pancreas & Upper GIT', 'Urological & Trauma'];

const DATA = [
  {

      title: 'Alvarado score (MANTRELS), max 10',

      ['CRP','Below 5 mg/L','Raised; very high values suggest perforation or abscess'],
      ['Serum creatinine','0.6–1.2 mg/dL','Normal, or raised if dehydrated or septic'],
      ['Lactate','0.5–2.0 mmol/L','Above 2 suggests sepsis, perforation or ischaemia'],

    algo: {triage:'Peritonitis, sepsis or shock (hypotension, HR above 120)?',

      stable:['Alvarado or AIR score; US (children, young women, pregnancy) or IV-contrast CT (adults) if intermediate.','Alvarado 7 or more, or confirmed on imaging: laparoscopic appendicectomy within 24 h. Abscess: antibiotics and drainage. Low score: observe and re-examine.']},
    resus: ['NPO from the time of suspicion; maintenance IV crystalloid, bolus if dehydrated or septic.',

            'Antiemetic; urinary catheter only if septic or needing strict output.',

    imaging: ['Bedside/graded-compression US (first line in children, young women, pregnancy): non-compressible blind-ended tubular structure over 6 mm, target sign, appendicolith, hyperechoic peri-appendiceal fat, free fluid.',

  },

  {

    keywords: ['epigastric pain', 'lipase', 'amylase', 'Atlanta', 'necrosis', 'gallstone pancreatitis', 'Ranson', 'BISAP', 'fluids'],
    highlight: {

    labs: [['Serum lipase','10–140 U/L','Above 3x ULN (above 420 U/L)'],
      ['Serum amylase','30–110 U/L','Above 3x ULN; less specific and normalises in 3–5 days'],
      ['ALT','7–56 U/L','Above 150 U/L suggests gallstone cause'],
      ['Triglycerides','Below 150 mg/dL','Above 1000 mg/dL (11.3 mmol/L) suggests hypertriglyceridaemic cause'],
      ['Calcium','8.5–10.5 mg/dL','Hypocalcaemia signals severe disease'],
      ['Haematocrit','M 41–50%, F 36–46%','Above 44% (haemoconcentration) predicts necrosis'],
      ['BUN','7–20 mg/dL','Above 20 or rising at 24 h predicts poor outcome (BISAP)'],
      ['CRP','Below 5 mg/L','Above 150 mg/L at 48 h predicts severe disease'],
      ['Serum creatinine','0.6–1.2 mg/dL','Above 1.9 mg/dL = renal organ failure (Marshall)']],
    algo: {triage:'Persistent organ failure, shock or hypoxia?',
      unstable:['HDU/ICU, 2 large-bore IVs, goal-directed Lactated Ringer, oxygen, analgesia, lactate, ABG; watch for ACS.','Contrast CT after resuscitation for necrosis, bleeding or perforation. ERCP within 24 h if cholangitis. Laparotomy for refractory ACS or ischaemic bowel.'],

/* ===================== Rendering and filtering ===================== */
const SECTIONS = [
  { key: 'resus', letter: 'a', label: 'Immediate Bedside Resuscitation', color: 'var(--c-resus)', open: true },
  { key: 'diagnostics', letter: 'b', label: 'Essential Diagnostics & Labs', color: 'var(--c-diag)' },
  { key: 'imaging', letter: 'c', label: 'First-line Imaging & Bedside Ultrasound', color: 'var(--c-img)' },
  { key: 'triggers', letter: 'd', label: 'Surgical Triggers & Red Flags', color: 'var(--c-trig)' }
];
const $ = (s) => document.querySelector(s);
let query = '', category = 'All';

const labsHTML = (L) => `<div><div class="lab head"><span>Test</span><span>Normal range</span><span>Expected finding in this disease</span></div>${L.map(l => `<div class="lab"><span class="n">${l[0]}</span><span class="r">${l[1]}</span><span class="f" style="--c:var(--c-diag)">${l[2]}</span></div>`).join('')}</div>`;
const flowHTML = (a) => {
  const br = (cls, label, col, st) => `<div class="br" style="--c:${col}"><div class="brh">${label}</div><div class="fbox"><b>Step 2: Stabilisation and work-up</b>${st[0]}</div><div class="farrow">▼</div><div class="fbox"><b>Step 3: Definitive medical or surgical action</b>${st[1]}</div></div>`;
  return `<details class="sec" style="--c:var(--blue)" open><summary><span class="badge" aria-hidden="true">e</span><span>Clinical Decision Algorithm (AMBOSS-Style Flowchart)</span><svg class="chev" width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M7 4l7 6-7 6z"/></svg></summary>
    <div class="body flow"><div class="fbox" style="--c:var(--blue)"><b>Step 1: Triage</b>${a.triage}</div><div class="farrow">▼</div>
    <div class="fbranches">${br('u','Hemodynamically UNSTABLE','var(--c-resus)',a.unstable)}${br('s','Hemodynamically STABLE','var(--c-diag)',a.stable)}</div></div></details>`;
};
function cardHTML(c) {
  const hl = c.highlight ? `
    <div class="hl p-3 mt-3">
      <h3 class="font-semibold text-sm">${c.highlight.title}</h3>
      <dl class="mt-2 grid gap-y-1 text-sm">
        ${c.highlight.rows.map(r => `<div class="flex gap-3 justify-between border-b border-dashed pb-1" style="border-color:var(--line)"><dt class="muted">${r[0]}</dt><dd class="font-semibold text-right">${r[1]}</dd></div>`).join('')}
      </dl>
      ${c.highlight.note ? `<p class="text-sm mt-2">${c.highlight.note}</p>` : ''}
    </div>` : '';
  const secs = SECTIONS.map(s => `
    <details class="sec" style="--c:${s.color}" ${s.open ? 'open' : ''}>
      <summary><span class="badge" aria-hidden="true">${s.letter}</span><span>${s.label}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M7 4l7 6-7 6z"/></svg></summary>
      ${s.key === 'diagnostics' && c.labs ? labsHTML(c.labs) : ''}<ul>${(c[s.key] || []).map(i => `<li>${i}</li>`).join('')}</ul>
    </details>`).join('');
  return `
    <article class="card p-4 sm:p-5" id="${c.id}" data-cat="${c.category}">
      <div class="flex flex-wrap items-start justify-between gap-2">
        <div class="min-w-0">
          <h2 class="text-xl font-bold">${c.name}</h2>
          <p class="text-sm muted mt-0.5">${c.presentation}</p>
        </div>
        <span class="pill">${c.category}</span>
      </div>
      ${hl}
      <div class="flex justify-end gap-2 mt-3 mb-2">
        <button class="btn" data-act="expand">Expand all</button>
        <button class="btn" data-act="collapse">Collapse all</button>
      </div>
      <div class="grid gap-2">${secs}${c.algo ? flowHTML(c.algo) : ''}</div>
    </article>`;
}

function build() {
  $('#list').innerHTML = DATA.map(cardHTML).join('');
  const cats = ['All', ...CATEGORIES];
  $('#chips').innerHTML = cats.map(c => `<button class="chip rounded-full px-4 py-1.5 text-sm" data-cat="${c}" aria-pressed="${c === category}">${c}</button>`).join('');
  DATA.forEach(c => { c._hay = [c.name, c.presentation, c.category, ...(c.keywords || []), ...(c.labs || []).map(l => l[0])].join(' ').toLowerCase(); });
}

function apply() {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  DATA.forEach(c => {
    const ok = (category === 'All' || c.category === category) && terms.every(t => c._hay.includes(t));
    document.getElementById(c.id).hidden = !ok;
    if (ok) shown++;
  });
  $('#empty').classList.toggle('hidden', shown > 0);
  $('#count').textContent = `${shown} of ${DATA.length} conditions`;
  document.querySelectorAll('#chips .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === category));
}

$('#q').addEventListener('input', e => { query = e.target.value; apply(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  category = b.dataset.cat; apply();
});
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const open = b.dataset.act === 'expand';
  b.closest('article').querySelectorAll('details').forEach(d => d.open = open);
});

build(); apply();
</script>
</body>
</html>
